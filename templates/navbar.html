<header class="navbar">
    <div class="navbar-left">
        <button class="toggle-sidebar-btn" id="toggleSidebarBtn" title="Toggle Menu">
            <i class="fa-solid fa-bars"></i>
        </button>
        <h2 style="font-size: 1.15rem; font-weight: 600; color: var(--text-main);">{% block header_title %}Dashboard Overview{% endblock %}</h2>
    </div>

    <div class="navbar-right">
        {% if user.is_authenticated %}
            <div class="user-profile-badge">
                <div class="user-avatar">
                    {{ user.username|slice:":1"|upper }}
                </div>
                <div class="user-info">
                    <span class="user-name">{{ user.get_full_name|default:user.username }}</span>
                    <span class="user-role">{{ user.role|default:"User" }}</span>
                </div>
            </div>
        {% else %}
            <a href="/login/" class="btn btn-primary"><i class="fa-solid fa-right-to-bracket"></i> Login</a>
        {% endif %}
    </div>
</header>
