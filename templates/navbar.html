<header class="navbar">
    <div class="navbar-left">
        <button class="toggle-sidebar-btn" id="toggleSidebarBtn" title="Toggle Menu">
            <i class="fa-solid fa-bars"></i>
        </button>
        <h2 style="font-size: 1.15rem; font-weight: 600; color: var(--text-main);">{% block header_title %}Dashboard Overview{% endblock %}</h2>
    </div>

    <div class="navbar-right">
        {% if user.is_authenticated %}
            <a href="{% url 'accounts:profile' %}" class="user-profile-badge" style="text-decoration: none;">
                <div class="user-avatar">
                    {% if user.profile_picture %}
                        <img src="{{ user.profile_picture.url }}" alt="Avatar" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">
                    {% else %}
                        {{ user.username|slice:":1"|upper }}
                    {% endif %}
                </div>
                <div class="user-info">
                    <span class="user-name">{{ user.get_full_name|default:user.username }}</span>
                    <span class="user-role">{{ user.get_role_display }}</span>
                </div>
            </a>
            <a href="{% url 'accounts:logout' %}" class="btn btn-secondary" style="padding: 0.4rem 0.75rem; font-size: 0.8rem;" title="Logout">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </a>
        {% else %}
            <a href="{% url 'accounts:login' %}" class="btn btn-primary"><i class="fa-solid fa-right-to-bracket"></i> Login</a>
        {% endif %}
    </div>
</header>
